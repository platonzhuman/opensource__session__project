  - javascripts/vendor/codemirror/mode/python/python.js
  - javascripts/vendor/codemirror/addon/edit/matchbrackets.js
  - javascripts/vendor/codemirror/addon/edit/closebrackets.js
  - javascripts/vendor/codemirror/addon/hint/show-hint.js
  - javascripts/vendor/codemirror/addon/comment/comment.js
  - javascripts/vendor/codemirror/addon/display/placeholder.js
  - javascripts/vendor/codemirror/addon/selection/active-line.js
  - javascripts/sql-playground.js
  - javascripts/mssql-local.js
  - javascripts/igu-sandbox.js
  - javascripts/content-layer.js
  - javascripts/quiz.js
  - javascripts/mission.js
  - javascripts/review.js
  - javascripts/course-shell.js
  - javascripts/practice-dock.js
  - javascripts/sandbox-tabs.js
  - javascripts/audio-seek.js
  - javascripts/motion.js
  - javascripts/course-cards.js
  - javascripts/mermaid-precapture.js
  - javascripts/vendor/mermaid/mermaid.min.js
