site_name: Learning
site_description: Один заход — одна домашка
site_url: http://127.0.0.1:8010/
docs_dir: docs

copyright: Личный тренажёр для домашек

theme:
  name: material
  language: ru
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Nunito
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.prune
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - header.autohide
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Тёмная тема

plugins:
  - search:
      lang: ru
      separator: '[\s\u200b\-]'

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
      smart_dollar: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: docs
      auto_append:
        - includes/abbreviations.md
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid-src
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: sqlplay
          class: sqlplay
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: mssqllocal
          class: mssqllocal
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: pyplay
          class: pyplay
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: cppplay
          class: cppplay
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: jsplay
          class: jsplay
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: quiz
          class: quiz
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css
  - stylesheets/playground.css
  - stylesheets/quiz.css
  - stylesheets/mission.css
  - stylesheets/review.css
  - stylesheets/course-shell.css
  - stylesheets/practice-dock.css
  - stylesheets/app.css
  - stylesheets/course-palette.css
  - stylesheets/liquid-glass.css
  - stylesheets/motion.css
  - stylesheets/mssql-local.css
  - javascripts/vendor/codemirror/lib/codemirror.css
  - javascripts/vendor/codemirror/addon/hint/show-hint.css

